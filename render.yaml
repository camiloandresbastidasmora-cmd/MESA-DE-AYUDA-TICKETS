services:
  - type: web
    name: mesa-de-ayuda-tickets
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString

databases:
  - name: helpdesk-db
    databaseName: helpdesk
    user: helpdesk_user
    plan: free
